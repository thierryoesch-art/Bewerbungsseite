<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Sonne, farblich abgestimmt auf .brand__sun in App.css -->
  <defs>
    <radialGradient id="sonne" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4f6b9" />
      <stop offset="30%" stop-color="#ead08a" />
      <stop offset="60%" stop-color="#f5c645" />
      <stop offset="100%" stop-color="#ee9f28" />
    </radialGradient>
    <radialGradient id="schein" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#ee9f28" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ee9f28" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Weicher Schein aussen herum, damit die Sonne auch auf hellen
       Browser-Tabs nicht einfach als gelber Fleck verschwindet. -->
  <circle cx="32" cy="32" r="32" fill="url(#schein)" />
  <circle cx="32" cy="32" r="21" fill="url(#sonne)" />
</svg>
